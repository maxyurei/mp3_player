<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the layout can reach under the iPhone notch and
         home indicator; user-scalable=no because a double-tap zoom would fight
         tap-to-play. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Player</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />

    <!-- iOS ignores the manifest's display mode and reads these instead.
         black-translucent puts the page under the status bar, which the
         safe-area padding in app.css accounts for. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Player" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />

    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main id="stage" class="stage">
      <section id="empty" class="empty">
        <h1 class="empty-title">Player</h1>
        <p id="emptyCopy" class="empty-copy"></p>

        <div class="pickers">
          <label class="picker" id="pickFolder">
            <input
              type="file"
              id="picker"
              webkitdirectory
              directory
              multiple
            />
            <span>Choose a folder</span>
          </label>
          <label class="picker" id="pickFiles">
            <input type="file" id="pickerFiles" multiple accept="audio/*" />
            <span>Choose songs</span>
          </label>
        </div>
      </section>

      <section id="now" class="now" hidden>
        <p id="artist" class="artist"></p>
        <h1 id="title" class="title"></h1>

        <div id="progress" class="progress" role="slider" aria-label="Seek">
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div class="times">
            <span id="elapsed">0:00</span>
            <span id="remaining">0:00</span>
          </div>
        </div>
      </section>

      <footer class="foot">
        <button id="status" class="status" type="button" aria-label="Open library">
          <svg class="status-chevron" viewBox="0 0 12 7" aria-hidden="true">
            <path d="M1 6l5-5 5 5" />
          </svg>
          <span id="statusText"></span>
        </button>
        <p id="hint" class="hint"></p>
      </footer>
    </main>

    <!-- Outside the stage, so its taps and drags never reach the stage's
         play/pause and skip gestures. -->
    <div id="sheet" class="sheet" hidden>
      <div id="sheetScrim" class="sheet-scrim"></div>
      <section id="sheetPanel" class="sheet-panel" role="dialog" aria-label="Library">
        <header id="sheetHead" class="sheet-head">
          <div class="sheet-grip" aria-hidden="true"></div>
          <label class="search">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="5" />
              <path d="M11 11l3.5 3.5" />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="go"
            />
          </label>
        </header>
        <div class="sheet-sub">
          <nav id="playlists" class="chips" aria-label="Playlists"></nav>
          <div class="sheet-bar">
            <span id="listCount" class="list-count"></span>
            <button id="shufflePlay" class="shuffle-play" type="button">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M1.5 4.5h2.5c3 0 5 7 8 7h2.5M12.5 9.5l2 2-2 2M1.5 11.5h2.5c1.2 0 2.2-1.1 3-2.4M14.5 4.5H12c-1.2 0-2.2 1.1-3 2.4M12.5 2.5l2 2-2 2" />
              </svg>
              Shuffle
            </button>
          </div>
        </div>
        <p id="songsEmpty" class="songs-empty" hidden></p>
        <ul id="songs" class="songs"></ul>
      </section>
    </div>

    <!-- One element for the whole session; see js/audio.js for why. -->
    <audio id="audio" preload="metadata" playsinline></audio>

    <script src="js/platform.js"></script>
    <script src="js/config.js"></script>
    <script src="js/shuffle.js"></script>
    <script src="js/queue.js"></script>
    <script src="js/metadata.js"></script>
    <script src="js/source-local.js"></script>
    <script src="js/source-remote.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/media-session.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/library.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
